services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: school_demo
      POSTGRES_PASSWORD: school_demo
      POSTGRES_DB: school_office
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - school_office_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_demo -d school_office"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  school_office_data:
